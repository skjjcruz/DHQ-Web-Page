# Research only (QB project): pulls week-by-week PFF grades for past
# seasons onto the working branch so the engine can be replayed with the
# grades PFF had before each game. Runs only on this branch; never on main.
name: PFF history pull

on:
  push:
    branches: [claude/nfl-matchup-success-formula-4lpib4]
    paths:
      - 'scripts/pff-history.mjs'
      - '.github/workflows/pff-history.yml'

permissions:
  contents: write

concurrency:
  group: pff-history
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull
        env:
          PFF_API_KEY: ${{ secrets.PFF_API_KEY }}
          MODE: probe
        run: |
          if [ "$MODE" = "probe" ]; then node scripts/pff-history.mjs probe; else node scripts/pff-history.mjs probe && node scripts/pff-history.mjs pull 2026 2025 2024; fi
      - name: Commit to this branch
        run: |
          git config user.name "dhq-snapshot-bot"
          git config user.email "noreply@dhqfootball.com"
          BRANCH="${{ github.ref_name }}"
          cp -r data/pff-history /tmp/pff-history
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p data/pff-history && cp -r /tmp/pff-history/. data/pff-history/
            git add data/pff-history
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -m "PFF history pull $(date -u '+%Y-%m-%d %H:%M UTC') [research]"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
