# Publishes the Lab to Cloudflare Pages, in parallel with GitHub Pages.
#
# GitHub Pages serves this repo straight from the branch, so this uploads
# the same files (everything except .git and .github). It runs on every push
# to main and after each snapshot job: the snapshot bots push with the
# workflow token, and those pushes never start other workflows on their own,
# so without the workflow_run trigger the data/ files on Cloudflare would go
# stale.
#
# Off until the repo has BOTH secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID: without them the run only prints a notice and
# deploys nothing. Optional repo variable CLOUDFLARE_PAGES_PROJECT overrides
# the project name below (the name is also the <name>.pages.dev address).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["PFF matchup snapshot", "Projections lock", "Usage snapshot", "WR model snapshot"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every run publishes the newest main, so a queued older run is not needed.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dhq-lab' }}
    steps:
      - name: Cloudflare not set up
        if: env.CF_READY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set; nothing was deployed to Cloudflare."

      - name: Checkout
        if: env.CF_READY == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: src

      - name: Stage the site
        if: env.CF_READY == 'true'
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a --exclude .git --exclude .github src/ site/
          [ -f site/index.html ] && [ -d site/data ] || { echo "Missing index.html or data/" >&2; exit 1; }
          # GitHub Pages answers an unknown path with a 404. Cloudflare Pages,
          # when a site has no 404.html, answers it with index.html and a 200,
          # which would turn a missing snapshot script into HTML.
          [ -f site/404.html ] || printf '<!doctype html><meta charset="utf-8"><title>Not found</title><p>Page not found. <a href="/">DHQ Lab</a></p>\n' > site/404.html
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        if: env.CF_READY == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          # First run creates the project; afterwards this fails harmlessly.
          preCommands: wrangler pages project create ${{ env.CF_PROJECT }} --production-branch=main || true
          command: pages deploy site --project-name=${{ env.CF_PROJECT }} --branch=main --commit-hash=${{ env.sha }} --commit-dirty=true
