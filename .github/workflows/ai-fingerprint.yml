# The AI analyst: Claude reads a short fact sheet on each player (our
# number, Sleeper's, Vegas, the injury report, the depth chart, the last
# three games) and says whether the DHQ projection makes sense. Answers go
# to data/ai/{season}-w{week}.json; spend is logged in data/ai/spend-*.json
# and the script stops itself at $8 a month. Needs the ANTHROPIC_API_KEY
# repo secret. Started by hand for now (Actions tab > AI fingerprint > Run).
name: AI fingerprint

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test (20 players), flagged (injured or big gaps, up to 80), weekly (250, half-price batch)'
        required: true
        default: 'test'
        type: choice
        options: [test, flagged, weekly]
      week:
        description: 'Week number. Leave blank for the current NFL week.'
        required: false

permissions:
  contents: write

concurrency:
  group: ai-fingerprint
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Claude SDK
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk
      - name: Ask the analyst
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          set -o pipefail
          node scripts/ai-fingerprint.mjs --mode "$MODE" ${WEEK:+--week "$WEEK"} | tee /tmp/ai-run.txt
          { echo '```'; cat /tmp/ai-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the answers
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          git config user.name "dhq-snapshot-bot"
          git config user.email "noreply@dhqfootball.com"
          mkdir -p /tmp/fresh-ai && cp data/ai/*.json /tmp/fresh-ai/
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p data/ai && cp /tmp/fresh-ai/*.json data/ai/
            git add data/ai
            if git diff --cached --quiet; then
              echo "Nothing new to commit."
              exit 0
            fi
            git commit -m "AI fingerprint $MODE $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), the branch moved; syncing and trying again."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the AI answers after three tries."
          exit 1
