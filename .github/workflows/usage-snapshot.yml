# Refreshes data/usage-snapshot.js (how each coaching staff spreads targets
# across its receivers and tight ends, with head-coach tenure) four times a
# day and on demand. Public Sleeper and ESPN endpoints; no secrets.
name: Usage snapshot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-usage-snapshot.mjs'
      - '.github/workflows/usage-snapshot.yml'
  schedule:
    - cron: '41 4,10,16,22 * * *'   # every six hours, UTC
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (four-digit year). Leave blank for the current season.'
        required: false

permissions:
  contents: write

concurrency:
  group: usage-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the snapshot
        run: node scripts/build-usage-snapshot.mjs ${{ github.event.inputs.season }}
      - name: Commit if changed
        # The branch can move while the build runs (a merge, or the other
        # snapshot job), so: keep the fresh build aside, sync to the latest
        # commit, lay the build back down, and push; up to three tries.
        run: |
          git config user.name "dhq-snapshot-bot"
          git config user.email "noreply@dhqfootball.com"
          cp data/usage-snapshot.js /tmp/fresh-snapshot.js
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp /tmp/fresh-snapshot.js data/usage-snapshot.js
            git add data/usage-snapshot.js
            if git diff --cached --quiet; then
              echo "Snapshot unchanged, nothing to commit."
              exit 0
            fi
            git commit -m "Usage snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), the branch moved; syncing and trying again."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the snapshot after three tries."
          exit 1
