<html lang="en">
<head>

    <title>Waiver Wire - Dynasty HQ</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap"></noscript>
    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #B8941E;
            --black: #0A0A0A;
            --off-black: #1A1A1A;
            --charcoal: #2A2A2A;
            --silver: #C0C0C0;
            --white: #FFFFFF;
            /* iPhone safe-area tokens (viewport-fit=cover above) — same names
               as index.html so the idiom carries across pages. 0px elsewhere. */
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* App root: full-height flex shell (height lives here, not inline, so
           the dvh line can fall back to vh on pre-15.4 iOS). dvh tracks the
           visual viewport — Safari's URL bar can't permanently clip the
           bottom panel rows, since inner-panel scrolling never collapses it. */
        .page-shell { height: 100vh; height: 100dvh; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(212,175,55,0.05); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

        /* ---- Header ---- */
        .tracker-header {
            background: linear-gradient(135deg, var(--off-black) 0%, var(--charcoal) 100%);
            border-bottom: 2px solid var(--gold);
            padding: 0.55rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .tracker-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.25rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            flex: 1;
            white-space: nowrap;
        }
        .back-btn {
            background: transparent;
            border: 1.5px solid var(--gold);
            color: var(--gold);
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.32rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            flex-shrink: 0;
        }
        .back-btn:hover { background: rgba(212,175,55,0.1); }
        .league-select {
            background: var(--charcoal);
            border: 1.5px solid rgba(212,175,55,0.4);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.76rem;
            padding: 0.32rem 0.55rem;
            border-radius: 4px;
            cursor: pointer;
            max-width: 200px;
        }
        .header-user {
            color: var(--silver);
            font-size: 0.63rem;
            opacity: 0.5;
            white-space: nowrap;
        }

        /* ---- Three-column grid ---- */
        .tracker-grid {
            display: grid;
            grid-template-columns: 1fr 437px 1fr;
            height: calc(100vh - 46px);
            overflow: hidden;
            gap: 0.6rem;
            padding: 0.6rem;
            box-sizing: border-box;
        }
        @media (min-width: 1024px) and (max-width: 1120px) {
            .tracker-grid { grid-template-columns: 1fr 380px 1fr; }
        }
        @media (max-width: 1023px) {
            .tracker-grid { grid-template-columns: 1fr; height: auto; overflow: visible; }
        }

        /* ---- Panels ---- */
        .panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(10,10,10,0.85);
            border: 2px solid rgba(212,175,55,0.2);
            border-radius: 10px;
        }
        .panel-header {
            background: rgba(212,175,55,0.07);
            border-bottom: 1px solid rgba(212,175,55,0.18);
            border-radius: 10px 10px 0 0;
            font-family: 'Inter', sans-serif;
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .ph-title {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0 0.7rem;
            height: 50px;
            overflow: hidden;
            flex-shrink: 0;
            white-space: nowrap;
        }
        /* Second row of each panel-header — fixed height for cross-column alignment */
        .ph-sub {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            padding: 0 0.5rem;
            height: 36px;
            overflow: hidden;
            border-top: 1px solid rgba(212,175,55,0.1);
            flex-shrink: 0;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.4rem 0.45rem;
        }

        /* ---- Stats column header row ---- */
        .stat-col-hdr {
            display: flex;
            align-items: center;
            padding: 0.18rem 0.85rem;
            gap: 0.35rem;
            border-bottom: 1px solid rgba(212,175,55,0.1);
            flex-shrink: 0;
        }
        .stat-lbl {
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            color: var(--gold);
            letter-spacing: 0.07em;
            opacity: 0.7;
            text-align: right;
            flex-shrink: 0;
        }

        /* ---- Position badge ---- */
        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            flex-shrink: 0;
            font-size: 0.62rem;
            font-weight: 700;
            border: 1.5px solid var(--gold);
            border-radius: 3px;
            padding: 2px 0;
            background: rgba(212,175,55,0.08);
            letter-spacing: 0.02em;
        }

        /* ---- Player rows (compact) ---- */
        .player-row {
            display: flex;
            align-items: center;
            padding: 0.22rem 0.3rem;
            margin-bottom: 0.15rem;
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
            gap: 0.35rem;
            transition: background 0.12s;
        }
        .player-row:hover { background: rgba(212,175,55,0.06); }
        .player-name {
            flex: 0 0 160px;
            width: 160px;
            font-size: 0.9375rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .player-team {
            font-size: 0.68rem;
            color: var(--silver);
            opacity: 0.5;
        }
        /* Stat cell */
        .sc {
            font-size: 0.72rem;
            font-weight: 600;
            text-align: right;
            flex-shrink: 0;
        }
        .pos-group-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.76rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            padding: 0.38rem 0 0.14rem;
            opacity: 0.72;
        }

        /* ---- Center: filter buttons + search (inside .ph-sub) ---- */
        .filter-btn {
            background: transparent;
            border: 1px solid rgba(212,175,55,0.27);
            color: var(--silver);
            font-family: 'Inter', sans-serif;
            font-size: 0.67rem;
            font-weight: 600;
            padding: 0.18rem 0.4rem;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: all 0.1s;
        }
        .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--black); }
        .search-input {
            flex: 0 1 90px;
            min-width: 50px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(212,175,55,0.27);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.76rem;
            padding: 0.18rem 0.42rem;
            border-radius: 3px;
        }
        .search-input::placeholder { color: rgba(192,192,192,0.33); }
        .search-input:focus { outline: none; border-color: rgba(212,175,55,0.58); }
        .add-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid rgba(212,175,55,0.52);
            background: transparent;
            color: var(--gold);
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.1s;
        }
        .add-circle:hover { background: var(--gold); color: var(--black); }

        /* ---- Quick-add bar ---- */
        .quick-add-bar {
            padding: 0.4rem 0.5rem;
            background: rgba(212,175,55,0.07);
            border-bottom: 1px solid rgba(212,175,55,0.26);
            flex-shrink: 0;
        }

        /* ---- Roster Table (My Roster panel) ---- */
        .roster-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .roster-table thead th {
            position: static;
            background: rgba(10,10,10,0.97);
            color: var(--gold);
            padding: 0.32rem 0.45rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.07em;
            border-bottom: 1px solid rgba(212,175,55,0.18);
            text-align: right;
        }
        .roster-table thead th.rth-pos    { text-align: center; width: 44px; }
        .roster-table thead th.rth-player { text-align: left; }
        .roster-table thead th.rth-yrs    { width: 40px; }
        .roster-table thead th.rth-pts    { width: 56px; }
        .roster-table thead th.rth-gp     { width: 36px; }
        .roster-table thead th.rth-avg    { width: 52px; }
        .roster-table thead th.rth-proj   { width: 48px; opacity: 0.6; }
        .roster-table td {
            padding: 0.27rem 0.45rem;
            vertical-align: middle;
            text-align: right;
            font-size: 0.72rem;
            font-weight: 600;
            border: none;
        }
        .roster-table td.rtd-pos {
            text-align: center;
            width: 44px;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            font-weight: 400;
            color: var(--gold);
            background: rgba(212,175,55,0.13);
            letter-spacing: 0.04em;
        }
        .roster-table td.rtd-player {
            text-align: left;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 0.82rem;
        }
        .roster-table td.rtd-player a {
            color: var(--white);
            text-decoration: none;
        }
        .roster-table td.rtd-player a:hover { color: var(--gold); }
        .roster-table td.rtd-num  { color: var(--silver); opacity: 0.75; }
        .roster-table td.rtd-pts  { color: var(--gold); opacity: 1; }
        .roster-table td.rtd-proj { color: var(--silver); opacity: 0.5; }
        /* Group header row */
        .roster-table tr.rt-group td {
            background: rgba(8,8,8,0.95);
            color: var(--gold);
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            padding: 0.28rem 0.45rem;
            border-bottom: 1px solid rgba(212,175,55,0.12);
            text-align: left;
            opacity: 1;
        }
        .roster-table tr.rt-group .rt-gw {
            display: flex;
            justify-content: space-between;
        }
        /* Separator row */
        .roster-table tr.rt-sep td {
            background: rgba(212,175,55,0.07);
            height: 2px;
            padding: 0;
        }
        /* Status colors on player cell */
        .roster-table td.ps-starter { background: rgba(6,78,59,0.55);   color: #ecfdf5 !important; opacity:1 !important; }
        .roster-table td.ps-ir      { background: rgba(127,29,29,0.55); color: #fee2e2 !important; opacity:1 !important; }
        .roster-table td.ps-taxi    { background: rgba(49,46,129,0.55);  color: #e0e7ff !important; opacity:1 !important; }
        /* Row hover */
        .roster-table tbody tr:not(.rt-group):not(.rt-sep):hover td { background: rgba(212,175,55,0.07); }
        .roster-table tbody tr:not(.rt-group):not(.rt-sep):hover td.rtd-pos { background: rgba(212,175,55,0.22); }

        /* ---- Right: FA Targets ---- */
        .budget-input-inline {
            background: transparent;
            border: none;
            border-bottom: 1.5px solid var(--gold);
            color: var(--gold);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            width: 90px;
            text-align: right;
        }
        .budget-input-inline:focus { outline: none; }
        .t-input {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(212,175,55,0.2);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            padding: 0.25rem 0.35rem;
            border-radius: 3px;
            min-width: 0;
        }
        .t-input::placeholder { color: rgba(192,192,192,0.28); }
        .t-input:focus { outline: none; border-color: rgba(212,175,55,0.52); }
        .t-submit {
            background: var(--gold);
            border: none;
            color: var(--black);
            font-family: 'Inter', sans-serif;
            font-size: 0.66rem;
            font-weight: 700;
            padding: 0.25rem 0.52rem;
            border-radius: 3px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ---- Targets rows (div-based, shares player-row layout) ---- */
        .del-btn {
            background: transparent;
            border: none;
            color: rgba(231,76,60,0.52);
            cursor: pointer;
            font-size: 0.82rem;
            padding: 0 0.12rem;
            line-height: 1;
        }
        .del-btn:hover { color: #E74C3C; }

        /* ---- States ---- */
        .center-msg { text-align: center; color: var(--silver); opacity: 0.5; padding: 2rem 1rem; font-size: 0.78rem; }

        /* ---- Mobile two-panel side-by-side (phone only, ≤768px) ---- */
        @media (max-width: 640px) {
            .tracker-grid {
                grid-template-columns: 1fr 1fr !important;
                height: calc(100vh - 46px) !important;
                height: calc(100dvh - 46px) !important; /* visual-viewport height; invalid → vh line above stands (pre-15.4 iOS) */
                gap: 0.22rem !important;
                padding: 0.22rem !important;
            }
            /* Hide My Roster on phone — FA list + Targets only */
            .roster-panel { display: none !important; }
            /* Compact header */
            .panel-header .ph-title {
                font-size: 0.75rem;
                height: 32px;
                padding: 0 0.4rem;
                gap: 0.25rem;
            }
            .ph-sub {
                height: 28px;
                padding: 0 0.3rem;
                gap: 0.15rem;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .ph-sub::-webkit-scrollbar { display: none; }
            .filter-btn { font-size: 0.52rem; padding: 0.1rem 0.22rem; }
            .search-input { font-size: 0.6rem; padding: 0.1rem 0.28rem; }
            /* Compact rows */
            .player-row { padding: 0.14rem 0.18rem; gap: 0.18rem; margin-bottom: 0.1rem; }
            .pos-badge { width: 22px; font-size: 0.5rem; padding: 1px 0; }
            /* Name fills remaining space instead of fixed 160px */
            .player-name {
                flex: 1 !important;
                width: auto !important;
                min-width: 0 !important;
                font-size: 0.65rem !important;
            }
            .player-team { display: none; }
            .sc { font-size: 0.6rem; }
            .stat-col-hdr { padding: 0.12rem 0.4rem; gap: 0.18rem; }
            .stat-lbl { font-size: 0.55rem; }
            /* Hide non-essential stat columns */
            .mob-hide { display: none !important; }
            /* Tighten quick-add bar */
            .quick-add-bar { padding: 0.25rem 0.3rem; }
            .add-circle { width: 20px; height: 20px; font-size: 0.85rem; }
            /* Targets panel: FA$ column also hidden */
            .mob-hide-fa { display: none !important; }
        }

        /* ---- Panel tab switcher ---- */
        .fa-tab-btn {
            background: transparent;
            border: 1.5px solid rgba(212,175,55,0.3);
            color: rgba(255,255,255,0.45);
            font-family: 'Inter', sans-serif;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 0.18rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .fa-tab-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.08); }
        .fa-tab-btn:hover:not(.active) { border-color: rgba(212,175,55,0.5); color: rgba(212,175,55,0.7); }

        /* ---- AI Scout (right panel) ---- */
        .ai-mode-btn { padding: 0.2rem 0.55rem; border: 1.5px solid rgba(212,175,55,0.3); background: transparent; color: rgba(255,255,255,0.45); font-family: 'Inter', sans-serif; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .ai-mode-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.08); }
        .ai-mode-btn:hover:not(.active) { border-color: rgba(212,175,55,0.5); color: rgba(212,175,55,0.7); }
        .ai-analyze-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.38rem 1rem; background: linear-gradient(135deg,rgba(212,175,55,0.15),rgba(212,175,55,0.07)); border: 1.5px solid var(--gold); color: var(--gold); font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .ai-analyze-btn:hover:not(:disabled) { background: rgba(212,175,55,0.2); box-shadow: 0 0 10px rgba(212,175,55,0.18); }
        .ai-analyze-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .ai-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(212,175,55,0.3); border-top-color: var(--gold); border-radius: 50%; animation: ai-spin 0.75s linear infinite; }
        @keyframes ai-spin { to { transform: rotate(360deg); } }
        .ai-output { background: rgba(212,175,55,0.04); border: 1px solid rgba(212,175,55,0.18); border-radius: 6px; padding: 0.85rem 0.95rem; margin-top: 0.65rem; font-size: 0.75rem; color: var(--silver); line-height: 1.72; }
        .ai-output strong { color: var(--gold); font-weight: 700; }
        .ai-chat-input { width: 100%; background: var(--charcoal); border: 1.5px solid rgba(212,175,55,0.25); color: var(--white); font-family: 'Inter', sans-serif; font-size: 0.74rem; padding: 0.5rem 0.6rem; border-radius: 5px; resize: vertical; min-height: 58px; margin-bottom: 0.6rem; box-sizing: border-box; }
        .ai-chat-input:focus { outline: none; border-color: var(--gold); }
        .ai-error-msg { color: #E74C3C; font-size: 0.73rem; padding: 0.5rem 0; }

        /* ---- Touch hit-area targets (tablet / coarse pointer) ---- */
        @media (pointer: coarse) {
            .back-btn,
            .league-select,
            .filter-btn,
            .search-input,
            .fa-tab-btn,
            .t-submit,
            .ai-analyze-btn,
            .ai-mode-btn { min-height: 44px; }
            .player-row { min-height: 44px; }
            /* Small glyph controls (26px add circle, del ✕): expand the HIT
               area to ≥44px via an invisible pseudo-halo — the visual stays
               the page's compact idiom. */
            .add-circle, .del-btn { position: relative; }
            .add-circle::after, .del-btn::after { content: ''; position: absolute; inset: -10px; }
        }

        /* ---- iPhone pass (≤767, plan Phase 3 item 17): safe-area chrome,
             16px inputs (iOS zoom-on-focus guard), home-indicator clearance.
             Phone-scoped — the tablet tier above is untouched. ---- */
        @media (max-width: 767px) {
            /* Header rides below the notch/status bar (installed-PWA draws
               under it with viewport-fit=cover); !important beats the inline
               JSX padding on the header row. */
            .tracker-header { padding: calc(0.4rem + var(--sat)) calc(1rem + var(--sar)) 0.4rem calc(1rem + var(--sal)) !important; }
            /* Safari zooms any focused input under 16px (same rule as the
               main app's phone tier). Overrides the ≤640 compact sizes. */
            input, select, textarea { font-size: 16px !important; }
            /* The 100dvh page shell is overflow:hidden inline; let the page
               scroll if content outgrows the viewport (641–767 band where
               the grid is height:auto). At ≤640 the grid fits exactly, so
               no scrollbar appears. */
            .page-shell { overflow-y: auto !important; }
            /* Bottom row of panels clears the home indicator. Placed after
               the ≤640 rules so the later padding-bottom wins. */
            .tracker-grid { padding-bottom: calc(0.32rem + var(--sab)) !important; }
        }
    </style>
</head>
